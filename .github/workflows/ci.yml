name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/ unittests/ -v

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: mypy .

  appium-run:
    needs: [test, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run automation on AWS Device Farm (stub)
        run: |
          echo "Called AWS Device Farm - stub result: PASSED"

      - name: Notify Slack (passed)
        if: success()
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"[Appium] :white_check_mark: passed (stub)\"}" \
            "${{ secrets.SLACK_JW_PLAYER_CI_WEBHOOK_URL }}"

      - name: Notify Slack (failed)
        if: failure()
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"[Appium] :x: Failed — Run: ${run_url}\"}" \
            "${{ secrets.SLACK_JW_PLAYER_CI_WEBHOOK_URL }}"
