# Environment-specific values - see docs/standards/standards.md "Config vs.
# environment". app_package/app_activity live here, not config.yaml, since a
# future build variant (e.g. a debug build with a suffixed applicationId)
# could genuinely need a different value per environment.
appium_server_url: "http://127.0.0.1:4723"
app_package: "com.joshuawallis.jwplayer"
app_activity: ".MainActivity"
# Set during the interactive AWS Device Farm setup session - not secrets,
# just resource identifiers, but genuinely tied to the AWS account/region
# this environment points at, same reasoning as appium_server_url above.
# The test spec ARN isn't here - device_farm_testspec.yml gets uploaded
# fresh on every run instead, so it can never silently go stale.
device_farm_project_arn: "arn:aws:devicefarm:us-west-2:975669876094:project:1fd1f05b-98b4-4250-a13a-dc3ab055f2f3"
device_farm_pool_arn: ""
